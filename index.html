<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coming Soon — Something New</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #080808;
            color: #ffffff;
            font-family: Arial, Helvetica, sans-serif;
            padding: 24px;
            overflow: hidden;
        }

        body::before {
            content: "";
            position: fixed;
            width: 500px;
            height: 500px;
            background: radial-gradient(
                circle,
                rgba(255, 255, 255, 0.09),
                transparent 70%
            );
            top: -200px;
            right: -150px;
            pointer-events: none;
        }

        body::after {
            content: "";
            position: fixed;
            width: 450px;
            height: 450px;
            background: radial-gradient(
                circle,
                rgba(255, 255, 255, 0.06),
                transparent 70%
            );
            bottom: -200px;
            left: -150px;
            pointer-events: none;
        }

        .container {
            width: 100%;
            max-width: 760px;
            text-align: center;
            position: relative;
            z-index: 1;
            animation: fadeIn 1.2s ease both;
        }

        .status {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            padding: 10px 16px;
            border: 1px solid #292929;
            border-radius: 50px;
            background: rgba(255, 255, 255, 0.035);
            color: #bdbdbd;
            font-size: 11px;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 38px;
        }

        .status-dot {
            width: 7px;
            height: 7px;
            background: #ffffff;
            border-radius: 50%;
            box-shadow: 0 0 12px rgba(255, 255, 255, 0.6);
            animation: pulse 1.8s infinite;
        }

        h1 {
            font-size: clamp(46px, 10vw, 92px);
            font-weight: 700;
            letter-spacing: -5px;
            line-height: 1.05;
            margin-bottom: 24px;
        }

        h1 span {
            display: block;
            color: #777777;
        }

        .description {
            max-width: 470px;
            margin: 0 auto;
            color: #929292;
            font-size: 16px;
            line-height: 1.9;
        }

        .divider {
            width: 50px;
            height: 1px;
            background: #555555;
            margin: 38px auto;
        }

        .progress-section {
            max-width: 340px;
            margin: 0 auto;
        }

        .progress-label {
            display: flex;
            justify-content: space-between;
            color: #858585;
            font-size: 11px;
            letter-spacing: 1px;
            margin-bottom: 12px;
            text-transform: uppercase;
        }

        .progress-bar {
            height: 3px;
            width: 100%;
            background: #242424;
            border-radius: 10px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            width: 72%;
            background: #ffffff;
            border-radius: 10px;
            animation: progress 2s ease both;
        }

        .footer {
            margin-top: 70px;
            color: #505050;
            font-size: 11px;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .footer span {
            color: #bcbcbc;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes pulse {
            0%, 100% {
                opacity: 1;
                transform: scale(1);
            }
            50% {
                opacity: 0.4;
                transform: scale(0.8);
            }
        }

        @keyframes progress {
            from {
                width: 0;
            }
            to {
                width: 72%;
            }
        }

        @media (max-width: 480px) {
            h1 {
                letter-spacing: -2.5px;
            }

            .description {
                font-size: 14px;
            }

            .footer {
                margin-top: 55px;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation: none !important;
            }
        }
    </style>
</head>

<body>
    <main class="container">

        <div class="status">
            <span class="status-dot"></span>
            Under Construction
        </div>

        <h1>
            Something
            <span>is coming.</span>
        </h1>

        <p class="description">
            We're working behind the scenes to build something
            exceptional. A new experience is on its way.
            Stay tuned.
        </p>

        <div class="divider"></div>

        <div class="progress-section">
            <div class="progress-label">
                <span>Development progress</span>
                <span>72%</span>
            </div>

            <div class="progress-bar">
                <div class="progress-fill"></div>
            </div>
        </div>

        <footer class="footer">
            Crafted with precision <span>•</span> Launching soon
        </footer>

    </main>
</body>
</html>
